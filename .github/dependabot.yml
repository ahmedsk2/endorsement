version: 2

# Vulnerability management that does not depend on somebody remembering.
#
# The weekly CI sweep tells you a dependency became vulnerable; this opens the pull request
# that fixes it. PDPL and NCA ECC-1 both expect a managed process rather than ad-hoc
# updates, and this system holds children's health data on a single-maintainer deployment —
# the realistic failure is not a bad patch, it is nobody looking for months.
#
# Grouped deliberately: one PR a week per ecosystem is something a clinician-maintainer
# will actually review. Twenty separate PRs is something they will mute.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      php-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      js-minor-and-patch:
        update-types:
          - minor
          - patch

  # Keeps the SHA pins in .github/workflows current — pinning without updates is how you
  # end up frozen on an action with a known flaw.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  # The runtime base images. A pinned FROM is only as good as the last time it was reviewed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
