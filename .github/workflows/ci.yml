name: CI

# Every push and a weekly sweep — the weekly run is what catches a dependency that became
# vulnerable while nobody was touching the code (PDPL/ECC-1 expect vulnerability management,
# not just a green build on the day you wrote it).
on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

# Least privilege for GITHUB_TOKEN. Without this block the token gets the repository
# default, which on many repos is write — so a compromised action (all six are now pinned
# to commit SHAs precisely because a mutable tag can be re-pointed under you) could push to
# the branch that Coolify deploys to the machine holding patient data. Nothing in CI needs
# more than read.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, intl, zip
          coverage: none

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      # Vitest TRANSPILES TypeScript without type-checking it, so `npm test` is green on code
      # tsc rejects — measured, not assumed: a planted `const x: number = "s"` in
      # packages/engine/src/index.ts left `npm test` at 238 passed while `tsc --noEmit` exited 2.
      # The two commands answer different questions and CI runs both. Placed before the build so
      # a type error fails in seconds rather than after the asset build and the PHP suite.
      - name: Type-check the engine package
        run: npx tsc --noEmit -p packages/engine

      # D4 gives the engine TWO runtimes and CI exercised one. `npm test` transpiles the package
      # per file through Vite and runs it in jsdom; `tsc --noEmit` reads types and emits nothing.
      # Neither answers whether the module graph BUNDLES, or whether the result runs outside a
      # bundler at all — and it cannot run from source: `moduleResolution: bundler` makes
      # `import … from './calendar'` a directory import Node's resolver refuses, and Node's
      # strip-only TypeScript mode refuses `evaluate.ts`'s constructor parameter properties. Both
      # measured; both recorded in packages/engine/bin/evaluate.mjs.
      #
      # NOT added to `npm run build`, deliberately: that script is what the Dockerfile's asset
      # stage runs, and the production image has no caller for this bundle (owner decision Y puts
      # services/engine in P3). Building it there would put an artifact nothing uses into the
      # image and would change a stage whose last surprise — `npm ci` exiting 0 with a declared
      # workspace absent — cost a whole task to find.
      - name: Bundle the engine for Node
        run: npm run build:engine

      # NAMED FOR WHAT IT IS, because the phase table's original wording — "the CI
      # cross-validation job" — is exactly what a later reader would take as a commitment already
      # met. THIS STEP IS SINGLE-IMPLEMENTATION REGRESSION COVERAGE (NF-08/QA-01). There is one
      # conditions engine; running a corpus against it says it still does what it did yesterday,
      # which is not the same claim as two implementations agreeing.
      #
      # The repository's one genuine cross-implementation check is elsewhere and runs under
      # `npm test`: packages/engine/test/golden.test.ts asserts the TypeScript calendar mirror
      # against tests/fixtures/calendar/golden.json, every value in which was produced by running
      # App\Support\Calendar in PHP. §4.3's real cross-validation — the engine against the CP-SAT
      # solver's evaluation mode — arrives in P4 with the solver that gives it a second side.
      #
      # What this step adds that `npm test` does not: the package under PLAIN NODE, reached only
      # through its public entry (src/index.ts, the module `@engine` resolves to — every test in
      # packages/engine/test imports by deep path), with the CLI's exit codes asserted per case.
      # It also MEASURES NF-01 and prints the number; the measurement does not fail the build, the
      # corpus above it does.
      - name: Engine corpus and CLI through the compiled Node entrypoint (one implementation, not cross-validation)
        run: npm run engine:corpus

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets
        run: npm run build

      # The light-only build guard reads the compiled CSS, so it must run after the build.
      - name: Backend tests
        run: php artisan test

      - name: Component tests
        run: npm test

      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      # Known-vulnerable dependencies fail the build; this is the patch SLA's alarm clock.
      - name: Composer security audit
        # --abandoned=report, so this gate means "there is a known VULNERABILITY" and
        # nothing else. Bare `composer audit` exits 1 on merely abandoned packages, and
        # six of those are unavoidable today: the web-token/jwt-* chain that
        # minishlink/web-push requires for VAPID signing. A gate that is red on every
        # push regardless of risk is one people stop reading, and then delete.
        run: composer audit --abandoned=report

      - name: npm security audit
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    runs-on: ubuntu-latest

    # 2026-08-09 ops rehearsal, finding 1: neither `test` nor `audit` above runs `composer
    # install` inside the Dockerfile's own vendor stage — they resolve dependencies on the
    # RUNNER's own PHP, a completely separate resolution from the one the production image
    # performs in its `composer:2` stage. That stage's platform check for `ext-intl` had
    # been failing since composer.json first required the extension (commit 2108c39) and
    # every push since was green, because nothing in CI had ever actually built the image —
    # a Coolify deploy was the first thing to try, and it failed. This job exists so a
    # broken production build shows up here, on every push, not on a deploy.
    #
    # Deliberately a bare `docker build`, not the full `docker/smoke.sh` rehearsal: smoke.sh
    # brings up the whole `docker-compose.production.yml` stack (real MySQL 8.4, generated
    # credentials, migrations, `/up`) and is owner-run, by design, against a throwaway copy
    # of the real stack — a heavier, slower, credential-bearing drill that belongs outside
    # CI. This job answers a narrower, cheaper question — "does the image build at all" —
    # which is exactly the class of defect this finding was.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production image
        run: docker build --progress=plain -t endorsement-ci-build:${{ github.sha }} .
