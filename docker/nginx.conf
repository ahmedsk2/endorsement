# No "user" directive here: the master already runs as app, and that directive is only
# meaningful — and only silent — when nginx starts as root.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No PHI in access logs: the app never puts identifiers in a URL (that is a governance
    # rule, tested), and query strings are dropped here as a second line of defence.
    log_format clean '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';
    access_log /dev/stdout clean;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Behind Traefik: trust its forwarded headers so the app sees the real scheme/IP.
    # DELIBERATELY NOT rewriting REMOTE_ADDR here.
    #
    # Client identity is resolved in exactly ONE place: Laravel's TrustProxies, using
    # TRUSTED_PROXIES. When nginx also rewrote it, the two layers disagreed — nginx handed
    # PHP the real client's PUBLIC address, which is by definition not in the trusted-proxy
    # ranges, so Laravel then refused to honour X-Forwarded-Proto, isSecure() went false and
    # HSTS silently stopped being sent on a live clinical system. Restoring it required
    # trusting every source again, which is what made audit IPs forgeable in the first place.
    #
    # Leaving REMOTE_ADDR as the proxy's address is what lets Laravel walk X-Forwarded-For
    # with a real trust list and stop at the genuine client.

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Hashed build assets are immutable; everything else is decided by the app
        # (which sets no-store on every authenticated response).
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60;
        }

        # Never serve dotfiles (.env, .git) even if one ends up in the web root.
        location ~ /\. {
            deny all;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
    }
}
