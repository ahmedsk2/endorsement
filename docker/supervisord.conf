[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The scheduler is what fires the handover reminders, the hourly audit-chain
; verification, the nightly encrypted backup and the retention sweep. Without it those
; controls exist but never run.
;
; `schedule:work`, NOT a `while true; schedule:run; sleep 60` loop. The loop's period is
; 60s PLUS however long the run took, so it drifts: every so often it steps over a clock
; minute entirely, and a dailyAt('01:30') job simply never fires that night. No command
; fails, so no onFailure escalation triggers — the backup would silently not happen a few
; nights a year and nothing would say so. schedule:work sleeps to the next minute boundary.
[program:scheduler]
command=/bin/sh -c "php /var/www/html/artisan schedule:work --no-interaction"
user=app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
